<!doctype html>
<html lang = "vi">
	<head>
		<title>Quản lý học phần</title>
		<meta charset = "utf-8">
	</head>
	<body>
			<div class="container">
				<h2>Quản lý học phần</h2>
				<button type="button" onclick="add();">Thêm</button>
				<button type="button" onclick="saveAll();" style="background-color: #e21616; color: white;">Lưu tất cả</button>
			</div>
			<div id="data-container"></div>
			<script>
				function add(){
					const newRow = document.createElement("div");
						newRow.setAttribute("class","row");
					const nhapMon = document.createElement("input");
						nhapMon.setAttribute("type","text");
						nhapMon.setAttribute("class","input-mon");
						nhapMon.setAttribute("placeholder","Nhập môn");
						nhapMon.setAttribute("width","60px");
					newRow.appendChild(nhapMon);
					const STC = document.createElement("input");
						STC.setAttribute("type","number");
						STC.setAttribute("class","input-stc");
						STC.setAttribute("placeholder","Số tín chỉ");
					newRow.appendChild(STC);
					const MainOption = document.createElement("select");
					const Option1 = document.createElement("option");
						Option1.setAttribute("class","select-loai");
						Option1.setAttribute("value","Cơ sở ngành");
						Option1.append("Cơ sở ngành");
						MainOption.appendChild(Option1);
					const Option2 = document.createElement("option");
						Option2.setAttribute("class","select-loai");
						Option2.setAttribute("value","Chuyên ngành");
						Option2.append("Chuyên ngành");
						MainOption.appendChild(Option2);
					newRow.appendChild(MainOption);
					const Remove = document.createElement("button");
					Remove.setAttribute("type", "button");
					Remove.textContent = "Xóa";
					Remove.onclick = function() {
						newRow.remove();
					};
					newRow.appendChild(Remove);
					document.body.appendChild(newRow);
				}
				function saveAll() {
					const allRows = document.querySelectorAll(".row");
					const data = [];

					allRows.forEach(row => {
						const mon = row.querySelector(".input-mon").value;
						const stc = row.querySelector(".input-stc").value;
						const loai = row.querySelector(".select-loai").value;

						if (mon || stc) { // Chỉ lưu nếu có nhập dữ liệu
							data.push({
								tenMon: mon,
								soTinChi: stc,
								loaiMon: loai
							});
						}
					});

					if (data.length === 0) {
						alert("Không có dữ liệu để lưu!");
						return;
					}
					alert("Đã lưu " + data.length + " môn học thành công! (Kiểm tra Console F12)");
				}
			</script>
	</body>
</html>
