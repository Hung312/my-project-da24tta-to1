<!doctype html>
<html lang = "vi">
	<head>
		<title>Hệ thống đăng nhập</title>
		<meta charset = "utf-8">
		<link rel ="stylesheet" href= "../css/style2.css">
	</head>
	<body>
			<div class="container">
				<form id="Login">
					<h3 id="title">Hệ thống đăng nhập</h3>
					<div class ="form-group">
						<label for ="username">Tên đăng nhập:</label>
						<input class="form-config" type = "txt" id = "txtUsername" name = "Username">
					</div>
					<div class ="form-group">
						<label for ="password">Nhập mật khẩu:</label>
						<input class="form-config" type = "password" id = "txtPassword" name = "Password">
					</div>
					<div>
						<input class="button" type="submit" id = "subLogin" name = "subLogin" value = "Đăng nhập">
						<input class="button" type="reset" id = "Cancel" name = "Cancel" value = "Nhập lại">
					</div>
					<div class="Register"><a id="link" href="html/page3.html">Đăng ký</a></div>
				</form>
			</div>
	</body>
</html>
