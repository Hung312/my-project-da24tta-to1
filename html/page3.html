<!doctype html>
<html lang = "vi">
	<head>
		<title>Đăng ký</title>
		<meta charset = "utf-8">
		<link rel ="stylesheet" href= "../css/style3.css">
	</head>
	<body>
			<div class="container">
				<h3 id="title">Đăng ký</h3>
				<form>
					<div class="form-control">
						<label id="fullname">Họ tên:</label>
						<input id="form-config" type="txt" id="txtFullname" name="Fullname">
					</div>
					<div class="form-control">
						<label id="MSSV">Mã số sinh viên:</label>
						<input id="form-config" type="number" id="numMSSV" name="MSSV">
					</div>
					<div class="form-control">
						<label id="class">Lớp:</label>
						<input id="form-config" type="radio" id="radClass" name="Class">
					</div>
				</form>
			</div>
	</body>
</html>
